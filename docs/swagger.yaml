basePath: /
definitions:
  agent.PipelineResult:
    properties:
      alerts:
        items:
          $ref: '#/definitions/model.Alert'
        type: array
      behavior_dna:
        $ref: '#/definitions/model.BehaviorDNA'
      recommendations:
        items:
          $ref: '#/definitions/model.Recommendation'
        type: array
      transaction:
        $ref: '#/definitions/model.Transaction'
    type: object
  controller.ChatRequest:
    properties:
      message:
        example: spent 250 baht on lunch
        type: string
    required:
    - message
    type: object
  controller.CorrectionRequest:
    properties:
      behavior_tag:
        example: treat
        type: string
      brand:
        example: Starbucks
        type: string
      category:
        example: Food & Drink
        type: string
      sub_category:
        example: Coffee
        type: string
    type: object
  controller.CreateQuestPresetRequest:
    properties:
      accent:
        example: '#D9463B'
        type: string
      behavior_tag:
        example: impulse
        type: string
      category:
        example: Food & Beverage
        type: string
      difficulty:
        allOf:
        - $ref: '#/definitions/model.QuestDifficulty'
        example: advanced
      is_active:
        type: boolean
      key:
        example: coffee_cap_weekly_250
        type: string
      logo:
        example: ☕
        type: string
      name:
        example: Coffee discipline
        type: string
      period:
        allOf:
        - $ref: '#/definitions/model.QuestPeriod'
        example: weekly
      rule_type:
        allOf:
        - $ref: '#/definitions/model.QuestRuleType'
        example: coffee_spend_cap
      sub_category:
        example: Coffee
        type: string
      target:
        example: 500
        type: number
      unit:
        example: thb
        type: string
      xp:
        example: 50
        type: integer
    required:
    - difficulty
    - key
    - name
    - period
    - rule_type
    - xp
    type: object
  controller.CreateWalletRequest:
    properties:
      icon:
        type: string
      name:
        type: string
      target:
        type: number
    required:
    - name
    type: object
  controller.ErrorResponse:
    properties:
      error:
        example: something went wrong
        type: string
    type: object
  controller.GenerateQuestsRequest:
    properties:
      period:
        allOf:
        - $ref: '#/definitions/model.QuestPeriod'
        example: daily
    required:
    - period
    type: object
  controller.LineEvent:
    properties:
      message:
        $ref: '#/definitions/controller.LineMessage'
      replyToken:
        example: nHuyWiB7yP5Zw52FIkcQobQuGDXCTA
        type: string
      source:
        $ref: '#/definitions/controller.LineSource'
      type:
        example: message
        type: string
    type: object
  controller.LineMessage:
    properties:
      text:
        example: spent 100 baht on coffee
        type: string
      type:
        example: text
        type: string
    type: object
  controller.LinePayload:
    properties:
      events:
        items:
          $ref: '#/definitions/controller.LineEvent'
        type: array
    type: object
  controller.LineSource:
    properties:
      userId:
        type: string
    type: object
  controller.SetCurrentWalletRequest:
    properties:
      wallet_id:
        type: integer
    required:
    - wallet_id
    type: object
  controller.UpdateQuestPresetRequest:
    properties:
      accent:
        type: string
      behavior_tag:
        type: string
      category:
        type: string
      difficulty:
        $ref: '#/definitions/model.QuestDifficulty'
      is_active:
        type: boolean
      key:
        type: string
      logo:
        type: string
      name:
        type: string
      period:
        $ref: '#/definitions/model.QuestPeriod'
      rule_type:
        $ref: '#/definitions/model.QuestRuleType'
      sub_category:
        type: string
      target:
        type: number
      unit:
        type: string
      xp:
        type: integer
    type: object
  controller.UpdateWalletRequest:
    properties:
      icon:
        type: string
      name:
        type: string
      target:
        type: number
    type: object
  model.Alert:
    properties:
      amount:
        type: number
      category:
        type: string
      category_avg:
        type: number
      message:
        type: string
      type:
        description: '"warning", "impulse_flag", "luxury_drift"'
        type: string
    type: object
  model.BehaviorDNA:
    properties:
      dominant_category:
        type: string
      impulse_frequency:
        description: count in last 30 days
        type: integer
      insufficient_data:
        description: true if < 5 transactions
        type: boolean
      luxury_drift_detected:
        description: true if drift > 20%
        type: boolean
      luxury_drift_index:
        description: '% change in discretionary spend'
        type: number
      top_brands:
        description: top 3 by frequency
        items:
          type: string
        type: array
    type: object
  model.QuestDifficulty:
    enum:
    - basic
    - advanced
    - expert
    - master
    - grand_master
    - easy
    - medium
    - hard
    type: string
    x-enum-varnames:
    - QuestBasic
    - QuestAdvanced
    - QuestExpert
    - QuestMaster
    - QuestGrandMaster
    - QuestEasy
    - QuestMedium
    - QuestHard
  model.QuestPeriod:
    enum:
    - daily
    - weekly
    type: string
    x-enum-varnames:
    - QuestPeriodDaily
    - QuestPeriodWeekly
  model.QuestPreset:
    properties:
      accent:
        type: string
      behavior_tag:
        type: string
      category:
        type: string
      created_at:
        type: string
      difficulty:
        $ref: '#/definitions/model.QuestDifficulty'
      id:
        type: integer
      is_active:
        type: boolean
      key:
        type: string
      logo:
        type: string
      name:
        type: string
      period:
        $ref: '#/definitions/model.QuestPeriod'
      rule_type:
        $ref: '#/definitions/model.QuestRuleType'
      sub_category:
        type: string
      target:
        type: number
      unit:
        type: string
      updated_at:
        type: string
      xp:
        type: integer
    type: object
  model.QuestRuleType:
    enum:
    - log_transaction_count
    - spend_cap
    - no_impulse
    - no_spend_days
    - category_spend_cap
    - coffee_spend_cap
    - beat_last_month_savings_rate
    type: string
    x-enum-varnames:
    - QuestRuleLogTransactionCount
    - QuestRuleSpendCap
    - QuestRuleNoImpulse
    - QuestRuleNoSpendDays
    - QuestRuleCategorySpendCap
    - QuestRuleCoffeeSpendCap
    - QuestRuleBeatLastMonthSavingsRate
  model.Recommendation:
    properties:
      description:
        type: string
      estimated_monthly_save:
        type: number
      priority:
        description: '"high", "medium", "low"'
        type: string
      title:
        type: string
    type: object
  model.Transaction:
    properties:
      amount:
        type: number
      behavior_tag:
        description: e.g. "impulse", "necessity", "social", "treat", "recurring"
        type: string
      brand:
        description: e.g. Starbucks, Grab, McDonald's
        type: string
      category:
        description: e.g. Food & Drink, Transport, Health
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      raw_message:
        type: string
      sub_category:
        description: e.g. Coffee, Taxi, Gym
        type: string
      type:
        $ref: '#/definitions/model.TransactionType'
      user_id:
        type: string
      wallet_id:
        type: integer
    type: object
  model.TransactionType:
    enum:
    - income
    - expense
    type: string
    x-enum-varnames:
    - Income
    - Expense
  model.UserCorrection:
    properties:
      behavior_tag:
        type: string
      brand:
        type: string
      category:
        type: string
      created_at:
        type: string
      id:
        type: integer
      raw_message:
        description: original message that was misclassified
        type: string
      sub_category:
        type: string
      user_id:
        type: string
    type: object
  model.Wallet:
    properties:
      created_at:
        type: string
      end_date:
        type: string
      icon:
        type: string
      id:
        type: integer
      is_archived:
        type: boolean
      name:
        type: string
      spent:
        type: number
      start_date:
        type: string
      target:
        type: number
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  service.AIRecommendation:
    properties:
      action:
        type: string
      priority:
        description: '"high", "medium", or "low"'
        type: string
      rationale:
        type: string
      title:
        type: string
    type: object
  service.Alert:
    properties:
      message:
        type: string
      type:
        description: '"warning", "info", "success"'
        type: string
    type: object
  service.AnalyticsDashboard:
    properties:
      behavior_breakdown:
        items:
          $ref: '#/definitions/service.BehaviorSpending'
        type: array
      behavior_insights:
        items:
          $ref: '#/definitions/service.BehaviorInsight'
        type: array
      category_breakdown:
        items:
          $ref: '#/definitions/service.CategoryBreakdown'
        type: array
      daily_spending:
        items:
          $ref: '#/definitions/service.DailySpending'
        type: array
      expense_comparison:
        $ref: '#/definitions/service.ComparisonMetric'
      irregular_purchases:
        items:
          $ref: '#/definitions/service.IrregularPurchase'
        type: array
      monthly_summary:
        $ref: '#/definitions/service.MonthlySummary'
      recent_highlights:
        items:
          $ref: '#/definitions/service.HighlightedTransaction'
        type: array
      savings_comparison:
        $ref: '#/definitions/service.ComparisonMetric'
      spending_by_day_of_week:
        items:
          $ref: '#/definitions/service.DayOfWeekSpending'
        type: array
    type: object
  service.BehaviorInsight:
    properties:
      description:
        type: string
      icon:
        description: emoji or icon name
        type: string
      metric:
        description: e.g. "3 times this week"
        type: string
      title:
        type: string
    type: object
  service.BehaviorSpending:
    properties:
      amount:
        type: number
      count:
        type: integer
      percentage:
        description: '% of total expense'
        type: number
      tag:
        description: '"impulse", "necessity", "social", "treat", "recurring"'
        type: string
    type: object
  service.BrandSpend:
    properties:
      amount:
        type: number
      brand:
        type: string
      visits:
        type: integer
    type: object
  service.CategoryBreakdown:
    properties:
      amount:
        type: number
      category:
        type: string
      percentage:
        type: number
      rank:
        type: integer
      sub_category:
        type: string
    type: object
  service.CategoryPage:
    properties:
      category:
        type: string
      items:
        items:
          $ref: '#/definitions/model.Transaction'
        type: array
      limit:
        type: integer
      month:
        type: string
      page:
        type: integer
      pages:
        type: integer
      total:
        type: integer
    type: object
  service.ComparisonMetric:
    properties:
      amount:
        type: number
      label:
        description: '"vs last month", "vs last week"'
        type: string
      percentage:
        description: positive or negative
        type: number
    type: object
  service.DailySpending:
    properties:
      date:
        description: e.g. "2025-04-01"
        type: string
      expense:
        type: number
      income:
        type: number
    type: object
  service.DayOfWeekSpending:
    properties:
      amount:
        type: number
      day:
        description: '"Mon", "Tue", etc.'
        type: string
    type: object
  service.GameProfileView:
    properties:
      level:
        type: integer
      level_name:
        type: string
      next_level_name:
        type: string
      total_xp:
        type: integer
      xp_for_next_level:
        type: integer
      xp_into_level:
        type: integer
    type: object
  service.HighlightedTransaction:
    properties:
      amount:
        type: number
      category:
        type: string
      description:
        type: string
      highlight:
        description: '"most_spent", "unusual", "recurring"'
        type: string
      id:
        type: integer
    type: object
  service.IrregularPurchase:
    properties:
      amount:
        type: number
      brand:
        type: string
      date:
        type: string
      description:
        type: string
      reason:
        description: why it's irregular
        type: string
    type: object
  service.LevelRewardView:
    properties:
      cosmetic:
        type: string
      feature:
        type: string
      icon:
        type: string
      level:
        type: integer
      name:
        type: string
      state:
        type: string
      unlocked:
        type: boolean
      xp_required:
        type: integer
    type: object
  service.MonthlyExpensePoint:
    properties:
      month:
        description: '"2026-04"'
        type: string
      total_expense:
        type: number
    type: object
  service.MonthlySummary:
    properties:
      alert:
        $ref: '#/definitions/service.Alert'
      balance:
        type: number
      month:
        description: e.g. "April 2025"
        type: string
      target:
        type: number
      total_expense:
        type: number
      total_income:
        type: number
    type: object
  service.PersonalFinanceInsight:
    properties:
      headline:
        type: string
      health:
        description: '"healthy", "watch", or "critical"'
        type: string
      key_findings:
        items:
          type: string
        type: array
      recommendations:
        items:
          $ref: '#/definitions/service.AIRecommendation'
        type: array
      status:
        type: string
      summary:
        type: string
    type: object
  service.QuestBoard:
    properties:
      can_generate_daily:
        type: boolean
      can_generate_weekly:
        type: boolean
      can_reroll:
        type: boolean
      daily_quests:
        items:
          $ref: '#/definitions/service.QuestView'
        type: array
      levels:
        items:
          $ref: '#/definitions/service.LevelRewardView'
        type: array
      profile:
        $ref: '#/definitions/service.GameProfileView'
      quests:
        items:
          $ref: '#/definitions/service.QuestView'
        type: array
      rewards:
        items:
          $ref: '#/definitions/service.LevelRewardView'
        type: array
      stats:
        $ref: '#/definitions/service.QuestStats'
      streak:
        $ref: '#/definitions/service.StreakView'
      weekly_quests:
        items:
          $ref: '#/definitions/service.QuestView'
        type: array
    type: object
  service.QuestStats:
    properties:
      current_batch_completed:
        type: integer
      current_batch_remaining:
        type: integer
      current_batch_total:
        type: integer
      current_batch_xp_available:
        type: integer
      current_batch_xp_earned:
        type: integer
      daily_completed:
        type: integer
      daily_total:
        type: integer
      total_xp:
        type: integer
      weekly_completed:
        type: integer
      weekly_total:
        type: integer
    type: object
  service.QuestView:
    properties:
      accent:
        type: string
      assigned_at:
        type: string
      completed_at:
        type: string
      current:
        type: number
      difficulty:
        type: string
      done:
        type: boolean
      expires_at:
        type: string
      key:
        type: string
      logo:
        type: string
      period:
        type: string
      target:
        type: number
      title:
        type: string
      unit:
        type: string
      xp:
        type: integer
      xp_awarded:
        type: boolean
    type: object
  service.SpendingDNA:
    properties:
      archetype:
        type: string
      archetype_description:
        type: string
      consistency:
        type: string
      dominant_category:
        type: string
      dominant_category_pct:
        type: number
      impulse_control:
        type: string
      impulse_frequency_30d:
        type: integer
      insufficient_data:
        type: boolean
      luxury_drift_detected:
        type: boolean
      luxury_drift_index:
        type: number
      save_rate:
        type: number
      top_brands:
        items:
          $ref: '#/definitions/service.BrandSpend'
        type: array
      volatility:
        type: string
    type: object
  service.StreakView:
    properties:
      best_days:
        type: integer
      current_days:
        type: integer
    type: object
  service.Summary:
    properties:
      balance:
        type: number
      total_expense:
        type: number
      total_income:
        type: number
    type: object
host: localhost:8080
info:
  contact: {}
  description: Chat-based personal finance tracker powered by OpenAI.
  title: Finance Chat API
  version: "1.0"
paths:
  /api/analytics:
    get:
      description: Returns comprehensive analytics for the given month. Defaults to
        current month.
      parameters:
      - description: Month to analyse (YYYY-MM, e.g. 2026-06). Defaults to current
          month.
        in: query
        name: month
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.AnalyticsDashboard'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get analytics dashboard data
      tags:
      - analytics
  /api/analytics/dna:
    get:
      description: Computes a real, data-derived behavioral snapshot — archetype,
        consistency/impulse-control/volatility labels, save rate, dominant category,
        impulse frequency, luxury drift, and top brands — entirely from real transactions.
        Not month-scoped; uses trailing 30/60-day windows like the existing behavior
        profiler.
      parameters:
      - description: Wallet ID to scope DNA to. Use 0 for General wallet.
        in: query
        name: wallet_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.SpendingDNA'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get the user's behavioral spending DNA
      tags:
      - analytics
  /api/analytics/insight:
    post:
      description: Explicitly invokes OpenAI using the calculated analytics for the
        selected month. This endpoint consumes AI tokens; GET /api/analytics does
        not.
      parameters:
      - description: Month to analyse (YYYY-MM, e.g. 2026-06). Defaults to current
          month.
        in: query
        name: month
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.PersonalFinanceInsight'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Generate an AI personal-finance insight
      tags:
      - analytics
  /api/analytics/trend:
    get:
      description: Returns just the total expense for each of the last `months` calendar
        months ending at `month`. Lightweight alternative to calling GET /api/analytics
        once per month.
      parameters:
      - description: Last month in the trend (YYYY-MM, e.g. 2026-06). Defaults to
          current month.
        in: query
        name: month
        type: string
      - description: Number of trailing months to include (1-24). Defaults to 6.
        in: query
        name: months
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/service.MonthlyExpensePoint'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get multi-month expense trend
      tags:
      - analytics
  /api/chat:
    post:
      consumes:
      - application/json
      description: Waits for the full LLM response, runs the agent pipeline, and returns
        the result with transaction, behavior DNA, alerts, and recommendations.
      parameters:
      - description: Message to parse
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.ChatRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/agent.PipelineResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Parse a natural language message (blocking)
      tags:
      - chat
  /api/chat/stream:
    post:
      consumes:
      - application/json
      description: |-
        Streams LLM tokens as Server-Sent Events. Each token is sent as `event: token`.
        When the model finishes, the pipeline result (transaction + behavior DNA + alerts + recommendations) is sent as `event: done` with JSON body.
        On error, `event: error` is sent and the stream closes.
      parameters:
      - description: Message to parse
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.ChatRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Parse a natural language message (SSE streaming)
      tags:
      - chat
  /api/corrections:
    get:
      description: Returns all manual corrections made by the user. These corrections
        are used to train the AI.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.UserCorrection'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all user corrections
      tags:
      - corrections
  /api/corrections/{id}:
    delete:
      description: Remove a correction by its ID. This will stop the AI from learning
        from this example.
      parameters:
      - description: Correction ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a user correction
      tags:
      - corrections
  /api/quest-presets:
    get:
      description: Returns DB-backed preset quests used by the reward assignment pool.
        Pass include_inactive=true to include archived presets.
      parameters:
      - description: Include inactive/deleted presets
        in: query
        name: include_inactive
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.QuestPreset'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List quest presets
      tags:
      - quests
    post:
      consumes:
      - application/json
      description: Creates a daily or weekly preset quest definition. User assignment/completion
        state remains stored separately.
      parameters:
      - description: Quest preset
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.CreateQuestPresetRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.QuestPreset'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a quest preset
      tags:
      - quests
  /api/quest-presets/{id}:
    delete:
      description: Archives a preset by setting is_active=false so existing user assignment
        history remains readable.
      parameters:
      - description: Quest preset ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a quest preset
      tags:
      - quests
    patch:
      consumes:
      - application/json
      description: Updates editable preset quest metadata/rules. Existing user assignments
        keep their stored template key and history.
      parameters:
      - description: Quest preset ID
        in: path
        name: id
        required: true
        type: integer
      - description: Quest preset fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.UpdateQuestPresetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.QuestPreset'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a quest preset
      tags:
      - quests
  /api/quests:
    get:
      description: Returns the user's active quest batches with progress evaluated
        live from real transactions, plus game profile (level/XP) and streak. This
        read does not auto-assign quests; call POST /api/quests/generate to activate
        daily or weekly quests.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.QuestBoard'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get the user's current quest board
      tags:
      - quests
  /api/quests/generate:
    post:
      consumes:
      - application/json
      description: Randomly picks active preset quests for the requested period if
        the user does not already have an active batch. Daily quests expire at next
        midnight; weekly quests expire after Sunday at next Monday 00:00.
      parameters:
      - description: Quest period to activate
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.GenerateQuestsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.QuestBoard'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Generate and activate daily or weekly quests
      tags:
      - quests
  /api/quests/reroll:
    post:
      description: Picks a new random batch of quest templates. Rejected with 400
        if the current batch still has an incomplete quest.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.QuestBoard'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Request a new set of quests
      tags:
      - quests
  /api/summary:
    get:
      description: Returns total income, total expense, and current balance.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.Summary'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get financial summary
      tags:
      - transactions
  /api/transactions:
    get:
      description: Returns all saved income and expense transactions, newest first.
      parameters:
      - description: Wallet ID to filter by. Use 0 for General wallet. Omit for all
          wallets.
        in: query
        name: wallet_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Transaction'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all transactions
      tags:
      - transactions
  /api/transactions/{id}:
    delete:
      description: Remove a transaction by its ID.
      parameters:
      - description: Transaction ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a transaction
      tags:
      - transactions
    get:
      description: Returns a single transaction by ID with full details.
      parameters:
      - description: Transaction ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Transaction'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get transaction details
      tags:
      - transactions
  /api/transactions/{id}/correct:
    patch:
      consumes:
      - application/json
      description: User can fix category, sub_category, brand or behavior_tag. Corrections
        are saved and fed back to the AI on future requests.
      parameters:
      - description: Transaction ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to correct (only non-empty fields are applied)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.CorrectionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Transaction'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Correct a transaction's classification
      tags:
      - transactions
  /api/transactions/by-category:
    get:
      description: Returns transactions filtered by category and optional month, sorted
        by most recent first.
      parameters:
      - description: Category name (e.g. Food & Beverage)
        in: query
        name: category
        type: string
      - description: Month filter YYYY-MM (e.g. 2026-06). Defaults to all months.
        in: query
        name: month
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.CategoryPage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List transactions by category (paginated)
      tags:
      - transactions
  /api/wallets:
    get:
      description: Returns all wallets for the user, including the implicit General
        wallet.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Wallet'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List wallets
      tags:
      - wallets
    post:
      consumes:
      - application/json
      description: Creates a new occasion wallet for the user.
      parameters:
      - description: Wallet to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.CreateWalletRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Wallet'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a wallet
      tags:
      - wallets
  /api/wallets/{id}:
    delete:
      description: Archives the wallet (or removes it, depending on its state) for
        the user.
      parameters:
      - description: Wallet ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove or archive a wallet
      tags:
      - wallets
    patch:
      consumes:
      - application/json
      description: Updates wallet details such as monthly target, name, or icon. Passing
        wallet ID 0 updates the user's General wallet after ensuring it exists.
      parameters:
      - description: Wallet ID
        in: path
        name: id
        required: true
        type: integer
      - description: Wallet fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.UpdateWalletRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Wallet'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a wallet
      tags:
      - wallets
  /api/wallets/current:
    get:
      description: Returns the wallet currently selected for new transactions.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get the current wallet
      tags:
      - wallets
    patch:
      consumes:
      - application/json
      description: Sets which wallet new transactions should be attributed to.
      parameters:
      - description: Wallet to switch to
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.SetCurrentWalletRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Set the current wallet
      tags:
      - wallets
  /webhook:
    post:
      consumes:
      - application/json
      description: Receives events from Line and replies with AI-parsed transaction
        info. Always returns 200.
      parameters:
      - description: Line webhook payload
        in: body
        name: body
        schema:
          $ref: '#/definitions/controller.LinePayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Line Messaging API webhook
      tags:
      - webhook
securityDefinitions:
  BearerAuth:
    description: LIFF ID token, e.g. "Bearer <id_token from liff.getIDToken()>"
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
